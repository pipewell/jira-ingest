[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "jira-ingest"
version = "0.1.0"
description = "Async Jira data pipeline supporting Data Center and Cloud, with pluggable multi-protocol output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # HTTP + async
    "aiohttp>=3.9",
    "aiofiles>=23.0",
    "aiocache>=0.12",
    "tenacity>=8.2",

    # Config
    "pydantic>=2.6",
    "pydantic-settings>=2.2",

    # Validation & serialisation
    "python-dateutil>=2.9",

    # Output formats
    "pandas>=2.2",
    "pyarrow>=15.0",

    # Multi-protocol I/O (local, S3, Azure, GCS, ADLS)
    "fsspec>=2024.3",
    "s3fs>=2024.3",
    "adlfs>=2024.2",
    "gcsfs>=2024.3",

    # CLI
    "click>=8.1",
]

[project.optional-dependencies]
redshift = [
    "redshift-connector>=2.1",
]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "python-dotenv>=1.0",
]

[project.scripts]
jira-ingest = "jira_ingest.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["jira_ingest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = ["B008"]  # do not perform function call in default args (Click uses this)

[tool.ruff.lint.isort]
known-first-party = ["jira_ingest"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
# Click and tenacity decorators are untyped; these are known false positives
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["jira_ingest.loader.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=jira_ingest --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*"]
